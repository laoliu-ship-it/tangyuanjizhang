<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'PF';
    src: local('PingFang SC'), local('Microsoft YaHei');
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:960px; overflow:hidden; }
  body {
    font-family: 'PingFang SC','PF','Microsoft YaHei',sans-serif;
    background:
      radial-gradient(1100px 700px at 78% 22%, rgba(224,164,88,0.16), transparent 60%),
      radial-gradient(900px 600px at 18% 85%, rgba(217,79,61,0.14), transparent 55%),
      linear-gradient(155deg, #201310 0%, #2a1712 45%, #1a100d 100%);
    position:relative;
    color:#f2e9dc;
  }

  /* subtle dot texture (halftone / tangyuan motif) */
  .texture {
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(242,233,220,0.05) 1.6px, transparent 1.6px);
    background-size: 26px 26px;
    opacity:0.5;
    mix-blend-mode: overlay;
  }

  .frame {
    position:absolute; inset:28px;
    border:1px solid rgba(242,233,220,0.14);
  }
  .corner-tl{position:absolute;top:-1px;left:-1px;width:22px;height:22px;border-top:1.5px solid #e0a458;border-left:1.5px solid #e0a458;}
  .corner-br{position:absolute;bottom:-1px;right:-1px;width:22px;height:22px;border-bottom:1.5px solid #e0a458;border-right:1.5px solid #e0a458;}

  .eyebrow {
    position:absolute; top:64px; left:96px;
    font-size:15px; letter-spacing:4px; color:#e0a458;
    text-transform:uppercase; font-weight:600;
    display:flex; align-items:center; gap:12px;
  }
  .eyebrow .dot { width:6px;height:6px;border-radius:50%;background:#e0a458; }

  .footer-label {
    position:absolute; bottom:56px; left:96px;
    font-size:14px; color:rgba(242,233,220,0.45); letter-spacing:1px;
  }
  .page-mark {
    position:absolute; bottom:56px; right:80px;
    font-size:14px; color:rgba(242,233,220,0.35); letter-spacing:2px;
  }

  /* LEFT CONTENT */
  .left {
    position:absolute; left:96px; top:210px; width:900px;
  }
  .logo-row { display:flex; align-items:center; gap:22px; margin-bottom:46px; }
  .brand-name {
    font-size:64px; font-weight:700; color:#f7efe2; letter-spacing:2px;
  }
  .brand-sub {
    font-size:20px; color:rgba(242,233,220,0.55); margin-top:6px; letter-spacing:3px;
  }

  .tagline {
    font-size:52px; font-weight:700; line-height:1.35;
    color:#f7efe2; margin-bottom:52px; letter-spacing:1px;
  }
  .tagline .accent { color:#e0a458; }

  .chips { display:flex; flex-wrap:wrap; gap:16px; }
  .chip {
    display:flex; align-items:center; gap:12px;
    padding:16px 24px;
    border:1px solid rgba(242,233,220,0.22);
    border-radius:999px;
    background:rgba(242,233,220,0.04);
    font-size:19px; color:#f2e9dc; font-weight:500;
    letter-spacing:0.5px;
  }
  .chip svg { width:20px; height:20px; flex-shrink:0; }

  /* RIGHT MOCKUP */
  .right { position:absolute; right:100px; top:150px; width:660px; height:660px; }

  .card {
    position:absolute; border-radius:20px;
    background:linear-gradient(160deg, rgba(255,247,236,0.08), rgba(255,247,236,0.02));
    border:1px solid rgba(242,233,220,0.18);
    box-shadow: 0 40px 80px rgba(0,0,0,0.45);
    backdrop-filter: blur(2px);
  }

  .card-receipt {
    left:10px; top:40px; width:300px; height:400px; padding:26px;
  }
  .receipt-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .receipt-head .tag { font-size:13px; color:rgba(242,233,220,0.5); letter-spacing:1px; }
  .receipt-lines { display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  .rline { height:9px; border-radius:5px; background:rgba(242,233,220,0.16); }
  .scan-line {
    position:absolute; left:26px; right:26px; top:150px; height:2px;
    background:linear-gradient(90deg, transparent, #e0a458, transparent);
    box-shadow:0 0 14px 2px rgba(224,164,88,0.7);
  }
  .cam-badge {
    position:absolute; top:-18px; left:-18px; width:56px; height:56px; border-radius:16px;
    background:linear-gradient(160deg,#e0a458,#c97d3d);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 24px rgba(224,164,88,0.35);
  }

  .arrow-mid {
    position:absolute; left:322px; top:180px; width:70px; height:40px;
  }

  .card-ledger {
    right:0; top:0; width:320px; height:260px; padding:26px;
  }
  .ledger-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .ledger-title { font-size:17px; font-weight:600; color:#f7efe2; }
  .ledger-sub { font-size:13px; color:rgba(242,233,220,0.5); margin-top:6px; }
  .amount { font-size:34px; font-weight:700; color:#e0a458; margin-top:22px; }
  .badge-ok {
    display:inline-flex; align-items:center; gap:6px;
    margin-top:18px; padding:6px 14px; border-radius:999px;
    background:rgba(120,200,140,0.15); border:1px solid rgba(120,200,140,0.4);
    font-size:13px; color:#9fe0ae;
  }
  .cat-tag {
    display:inline-block; margin-top:14px; padding:5px 12px; border-radius:8px;
    background:rgba(224,164,88,0.14); border:1px solid rgba(224,164,88,0.35);
    font-size:13px; color:#e0a458;
  }

  .card-chart {
    right:20px; bottom:0; width:300px; height:230px; padding:24px 24px 20px;
  }
  .chart-title { font-size:14px; color:rgba(242,233,220,0.55); margin-bottom:16px; letter-spacing:0.5px;}
  .bars { display:flex; align-items:flex-end; gap:10px; height:110px; }
  .bars div { flex:1; border-radius:4px 4px 0 0; background:linear-gradient(180deg,#e0a458,#a85c3a); }

  .store-stack { position:absolute; left:0; bottom:60px; display:flex; }
  .store-stack .s {
    width:44px;height:44px;border-radius:12px;margin-left:-14px;
    background:linear-gradient(160deg,#3a241c,#241512);
    border:1.5px solid rgba(242,233,220,0.35);
    display:flex;align-items:center;justify-content:center;
  }
  .store-stack .s:first-child{ margin-left:0; }
  .store-label { position:absolute; left:150px; bottom:74px; font-size:15px; color:rgba(242,233,220,0.65); }
</style>
</head>
<body>
  <div class="texture"></div>
  <div class="frame"><span class="corner-tl"></span><span class="corner-br"></span></div>

  <div class="eyebrow"><span class="dot"></span>SMART RESTAURANT LEDGER</div>

  <div class="left">
    <div class="logo-row">
      <svg width="84" height="84" viewBox="0 0 84 84">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f0c987"/>
            <stop offset="1" stop-color="#c97d3d"/>
          </linearGradient>
          <mask id="checkCut">
            <rect x="0" y="0" width="84" height="84" fill="white"/>
            <path d="M27 43 L38 54 L59 30" stroke="black" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </mask>
        </defs>
        <circle cx="42" cy="42" r="38" fill="url(#g1)" mask="url(#checkCut)"/>
        <circle cx="42" cy="42" r="38" fill="none" stroke="rgba(242,233,220,0.35)" stroke-width="1.5"/>
      </svg>
      <div>
        <div class="brand-name">汤圆记账</div>
        <div class="brand-sub">TANGYUAN LEDGER · 多店智能记账</div>
      </div>
    </div>

    <div class="tagline">拍照即入账<br><span class="accent">圆满</span>每一笔</div>

    <div class="chips">
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e0a458" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7l1.6-2.5h4.8L16 7"/><circle cx="12" cy="13.5" r="3.4"/></svg>
        拍照 OCR 自动识别
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e0a458" stroke-width="1.8"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4L12 3z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/></svg>
        AI 智能分类
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e0a458" stroke-width="1.8"><rect x="3" y="11" width="4" height="9"/><rect x="10" y="6" width="4" height="14"/><rect x="17" y="3" width="4" height="17"/></svg>
        经营数据一目了然
      </div>
      <div class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e0a458" stroke-width="1.8"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="13" width="7" height="7" rx="1.5"/><rect x="14" y="13" width="7" height="7" rx="1.5"/></svg>
        多门店统一管理
      </div>
    </div>
  </div>

  <div class="right">
    <div class="card card-receipt">
      <div class="cam-badge">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#241512" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7l1.6-2.5h4.8L16 7"/><circle cx="12" cy="13.5" r="3.4"/></svg>
      </div>
      <div class="receipt-head"><span class="tag">原始小票</span><span class="tag">07-02</span></div>
      <div class="receipt-lines">
        <div class="rline" style="width:70%"></div>
        <div class="rline" style="width:90%"></div>
        <div class="rline" style="width:55%"></div>
        <div class="rline" style="width:80%"></div>
        <div class="rline" style="width:40%"></div>
        <div class="rline" style="width:65%"></div>
      </div>
      <div class="scan-line"></div>
      <div class="receipt-lines" style="margin-top:26px; opacity:0.5;">
        <div class="rline" style="width:60%"></div>
        <div class="rline" style="width:75%"></div>
      </div>
    </div>

    <svg class="arrow-mid" viewBox="0 0 70 40" fill="none">
      <path d="M2 20 H60" stroke="#e0a458" stroke-width="2.5"/>
      <path d="M50 10 L64 20 L50 30" stroke="#e0a458" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div class="card card-ledger">
      <div class="ledger-top">
        <div>
          <div class="ledger-title">食材采购</div>
          <div class="ledger-sub">今日 09:24 · 现金支付</div>
        </div>
      </div>
      <div class="amount">-¥ 486.00</div>
      <div>
        <span class="cat-tag">食材成本</span>
        <span class="badge-ok">✓ 已核对入账</span>
      </div>
    </div>

    <div class="card card-chart">
      <div class="chart-title">本月经营趋势</div>
      <div class="bars">
        <div style="height:40%"></div>
        <div style="height:65%"></div>
        <div style="height:50%"></div>
        <div style="height:85%"></div>
        <div style="height:60%"></div>
        <div style="height:95%"></div>
      </div>
    </div>

    <div class="store-stack">
      <div class="s"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e0a458" stroke-width="1.8"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10h16V9"/><path d="M9 19v-6h6v6"/></svg></div>
      <div class="s"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e0a458" stroke-width="1.8"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10h16V9"/><path d="M9 19v-6h6v6"/></svg></div>
      <div class="s"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e0a458" stroke-width="1.8"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v10h16V9"/><path d="M9 19v-6h6v6"/></svg></div>
    </div>
    <div class="store-label">3 家门店 · 统一账本</div>
  </div>

  <div class="footer-label">tangyuanjizhang.zaixianapp.cn</div>
  <div class="page-mark">多店 · 多角色 · 一本账</div>
</body>
</html>
